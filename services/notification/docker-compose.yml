version: '3.8'

services:
  notification:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fec-notification-service
    ports:
      - "8001:8001"
    environment:
      - NOTIFICATION_ENV=development
      - NOTIFICATION_DEBUG=true
      - NOTIFICATION_REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis
    networks:
      - fec-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fec-notification-redis
    ports:
      - "6380:6379"  # Different port to avoid conflict with auth service
    volumes:
      - notification_redis_data:/data
    networks:
      - fec-network
    restart: unless-stopped

networks:
  fec-network:
    driver: bridge

volumes:
  notification_redis_data:

version: "3.9"

services:
  auth:
    build:
      context: ./auth
    container_name: auth-service
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      - auth-db

  auth-db:
    image: postgres:16
    container_name: auth-db
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: fec_auth
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

volumes:
  auth-db-data:


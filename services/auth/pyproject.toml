[tool.poetry]
name = "fec-saas-auth-service"
version = "0.1.0"
description = "Auth & User Management microservice for FEC SaaS"
authors = ["FEC SaaS"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
bcrypt = "^4.2.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
python-dotenv = "^1.0.0"
email-validator = "^2.3.0"
alembic = "^1.14.0"
httpx = "^0.28.0"
redis = "^5.0.0"
slowapi = "^0.1.9"
structlog = "^24.0.0"
secure = "^0.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
black = "^24.0.0"
isort = "^5.13.0"
mypy = "^1.14.0"
ruff = "^0.8.0"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: fec-auth
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # IMPORTANT: Replace these values in production!
  AUTH_SECRET_KEY: "CHANGE-THIS-IN-PRODUCTION-USE-STRONG-SECRET"
  AUTH_DATABASE_URL: "postgresql://postgres:postgres@postgres-service:5432/auth_db"
  AUTH_REDIS_URL: "redis://redis-service:6379/0"

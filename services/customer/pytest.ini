[pytest]
# =============================================================================
# Customer Service - Pytest Configuration
# =============================================================================

# Test paths
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async configuration
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires database)
    postgres: PostgreSQL-specific integration tests
    slow: Slow running tests
    smoke: Smoke tests for quick validation

# Default options
addopts =
    -v
    --strict-markers
    --tb=short
    -ra

# Logging
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for async tests (in seconds)
timeout = 30

# Coverage settings (when using pytest-cov)
# Run with: pytest --cov=app --cov-report=html
[tool:pytest-cov]
source = app
branch = True
omit =
    */tests/*
    */__pycache__/*
    */migrations/*

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
